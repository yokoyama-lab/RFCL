name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The project is pure standard-library Python with no dependencies,
      # and the tests import `pyrev_fl` from the repository root, so there
      # is nothing to install. tests_py/test_jana_integration.py self-skips
      # when the external Jana interpreter is not available.
      - name: Run tests
        run: python -m unittest discover -s tests_py -v

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/lean
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      # fail on sorry: every theorem must depend only on the standard axioms
      - name: Axiom check
        working-directory: proofs/lean
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          ! grep -q sorryAx axioms.txt
