name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The project is pure standard-library Python with no dependencies,
      # and the tests import `pyrev_fl` from the repository root, so there
      # is nothing to install. tests_py/test_jana_integration.py self-skips
      # when the external Jana interpreter is not available.
      - name: Run tests
        run: python -m unittest discover -s tests_py -v
